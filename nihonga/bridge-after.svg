<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 720" role="img" aria-labelledby="title desc">
  <title id="title">After: a rank-256 residual bridge</title>
  <desc id="desc">The original 4096-feature input is retained on a residual path. A down projection produces 256 features, GELU transforms them, and an up projection produces a 4096-feature correction. Adding that correction to the original input gives a 4096-feature output. The bridge has 2097152 weights and no attention.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#231F1A"/></marker></defs>
  <rect width="420" height="720" fill="#F7EEE3"/>
  <g stroke="#231F1A" stroke-width="1.3" fill="none" marker-end="url(#arrow)">
    <path d="M210 117 V154 M210 209 V249 M210 291 V326 M210 368 V414 M210 469 V511 M210 531 V550 M210 586 V620"/>
    <path d="M55 96 H28 V568 H191"/>
  </g>
  <g stroke="#231F1A" stroke-width="1.2">
    <rect x="55" y="75" width="310" height="42" rx="2" fill="#C3D3DB"/>
    <path d="M65 209 H355 L245 249 H175 Z" fill="#A7C2A0" fill-opacity=".4" stroke="none"/>
    <rect x="55" y="154" width="310" height="55" rx="2" fill="#A7C2A0"/>
    <rect x="175" y="249" width="70" height="42" rx="2" fill="#A7C2A0"/>
    <rect x="145" y="326" width="130" height="42" rx="2" fill="#A7C2A0"/>
    <path d="M175 384 H245 L355 414 H65 Z" fill="#A7C2A0" fill-opacity=".4" stroke="none"/>
    <rect x="55" y="414" width="310" height="55" rx="2" fill="#A7C2A0"/>
    <circle cx="210" cy="568" r="18" fill="#F7EEE3"/>
    <rect x="55" y="620" width="310" height="48" rx="2" fill="#A7C2A0"/>
  </g>
  <g font-family="Georgia,serif" fill="#231F1A" font-size="18" text-anchor="middle">
    <text x="210" y="38" font-style="italic" font-size="23">Learned replacement</text>
    <text x="210" y="102">Input h · 4,096 features per token</text>
    <text x="210" y="177">W_down · 4,096 → 256</text><text x="210" y="198" font-size="14">1,048,576 weights</text>
    <text x="210" y="276">256</text><text x="307" y="269" font-size="14">bottleneck</text><text x="307" y="286" font-size="14">features</text>
    <text x="210" y="353">GELU</text>
    <text x="210" y="437">W_up · 256 → 4,096</text><text x="210" y="458" font-size="14">1,048,576 weights</text>
    <text x="210" y="523" font-size="16">Learned correction Δh · 4,096</text>
    <text x="210" y="574" font-size="23">+</text>
    <text x="306" y="571" font-size="14">add original h</text>
    <text x="210" y="641">Student output h′ = h + Δh</text><text x="210" y="660" font-size="14">4,096 features per token</text>
    <text x="14" y="450" transform="rotate(-90 14 450)" font-size="13" fill="#5E564B">original h preserved unchanged</text>
    <text x="210" y="699" font-size="15" fill="#5E564B">2,097,152 weights · no attention</text>
  </g>
</svg>

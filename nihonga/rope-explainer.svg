<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1090" role="img" aria-labelledby="t d">
<title id="t">How RoPE encodes position</title>
<desc id="d">One pair of numbers from a query is drawn as an arrow. RoPE rotates it by an angle equal to position times a fixed frequency. Two tokens with the same content at different positions get different arrows. The attention score depends only on the difference in angle, that is, on the distance between the tokens. Different pairs rotate at different speeds, and in images some pairs follow the row and others the column.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#231F1A"/></marker></defs>
<rect width="760" height="1090" fill="#F7EEE3"/>
<g font-family="Georgia,serif">
<text x="380.0" y="36" font-size="23" text-anchor="middle" fill="#231F1A" font-style="italic">RoPE: position as a rotation</text>
<text x="30" y="76" font-size="17" text-anchor="start" fill="#231F1A" >1 · Same content, different place</text>
<text x="30" y="98" font-size="13" text-anchor="start" fill="#5E564B" >Two patches show the same letter, so their query q is the same. One pair of its numbers, drawn as an arrow:</text>
<circle cx="110" cy="185" r="58" fill="none" stroke="#5E564B" stroke-width=".6" stroke-dasharray="2 3"/>
<line x1="110" y1="185" x2="162.0" y2="185.0" stroke="#231F1A" stroke-width="2.2" marker-end="url(#arrow)"/><circle cx="110" cy="185" r="3" fill="#231F1A"/>
<text x="110" y="268" font-size="14" text-anchor="middle" fill="#231F1A" >column 0</text>
<text x="110" y="286" font-size="13" text-anchor="middle" fill="#5E564B" >rotated 0°</text>
<circle cx="280" cy="185" r="58" fill="none" stroke="#5E564B" stroke-width=".6" stroke-dasharray="2 3"/>
<line x1="280" y1="185" x2="325.0" y2="159.0" stroke="#231F1A" stroke-width="2.2" marker-end="url(#arrow)"/><circle cx="280" cy="185" r="3" fill="#231F1A"/>
<text x="280" y="268" font-size="14" text-anchor="middle" fill="#231F1A" >column 1</text>
<text x="280" y="286" font-size="13" text-anchor="middle" fill="#5E564B" >rotated 30°</text>
<circle cx="450" cy="185" r="58" fill="none" stroke="#5E564B" stroke-width=".6" stroke-dasharray="2 3"/>
<line x1="450" y1="185" x2="476.0" y2="140.0" stroke="#231F1A" stroke-width="2.2" marker-end="url(#arrow)"/><circle cx="450" cy="185" r="3" fill="#231F1A"/>
<text x="450" y="268" font-size="14" text-anchor="middle" fill="#231F1A" >column 2</text>
<text x="450" y="286" font-size="13" text-anchor="middle" fill="#5E564B" >rotated 60°</text>
<circle cx="620" cy="185" r="58" fill="none" stroke="#5E564B" stroke-width=".6" stroke-dasharray="2 3"/>
<line x1="620" y1="185" x2="620.0" y2="133.0" stroke="#231F1A" stroke-width="2.2" marker-end="url(#arrow)"/><circle cx="620" cy="185" r="3" fill="#231F1A"/>
<text x="620" y="268" font-size="14" text-anchor="middle" fill="#231F1A" >column 3</text>
<text x="620" y="286" font-size="13" text-anchor="middle" fill="#5E564B" >rotated 90°</text>
<text x="380.0" y="314" font-size="13" text-anchor="middle" fill="#5E564B" >angle = position × frequency (here 30° per column). The content (length) is unchanged; the direction says where.</text>
<text x="30" y="360" font-size="17" text-anchor="start" fill="#231F1A" >2 · The score only sees the distance</text>
<text x="30" y="382" font-size="13" text-anchor="start" fill="#5E564B" >Queries and keys are both rotated. Their dot product depends on the angle between them: θ·(m − n).</text>
<line x1="190" y1="470" x2="220.0" y2="418.0" stroke="#3E6B4A" stroke-width="2.2" marker-end="url(#arrow)"/><circle cx="190" cy="470" r="3" fill="#3E6B4A"/>
<line x1="190" y1="470" x2="138.0" y2="440.0" stroke="#7A5230" stroke-width="2.2" marker-end="url(#arrow)"/><circle cx="190" cy="470" r="3" fill="#7A5230"/>
<text x="190" y="548" font-size="14" text-anchor="middle" fill="#231F1A" >q at 2, k at 5</text>
<text x="190" y="566" font-size="13" text-anchor="middle" fill="#5E564B" >difference 3 positions → same score</text>
<line x1="570" y1="470" x2="600.0" y2="522.0" stroke="#3E6B4A" stroke-width="2.2" marker-end="url(#arrow)"/><circle cx="570" cy="470" r="3" fill="#3E6B4A"/>
<line x1="570" y1="470" x2="622.0" y2="440.0" stroke="#7A5230" stroke-width="2.2" marker-end="url(#arrow)"/><circle cx="570" cy="470" r="3" fill="#7A5230"/>
<text x="570" y="548" font-size="14" text-anchor="middle" fill="#231F1A" >q at 10, k at 13</text>
<text x="570" y="566" font-size="13" text-anchor="middle" fill="#5E564B" >difference 3 positions → same score</text>
<text x="110" y="420" font-size="14" text-anchor="middle" fill="#3E6B4A" >q</text>
<text x="132" y="420" font-size="14" text-anchor="middle" fill="#7A5230" >k</text>
<text x="30" y="612" font-size="17" text-anchor="start" fill="#231F1A" >3 · Each pair turns at its own fixed speed</text>
<text x="30" y="634" font-size="13" text-anchor="start" fill="#5E564B" >freq = 1 / 10000^(2i / d): nothing is learned. Fast pairs see neighbours, slow pairs see the coarse layout.</text>
<text x="30" y="681" font-size="14" text-anchor="start" fill="#231F1A" >fast pair</text>
<line x1="170" y1="676" x2="170.0" y2="656.0" stroke="#231F1A" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="170" cy="676" r="3" fill="#231F1A"/>
<line x1="232" y1="676" x2="248.8" y2="665.2" stroke="#231F1A" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="232" cy="676" r="3" fill="#231F1A"/>
<line x1="294" y1="676" x2="312.2" y2="684.3" stroke="#231F1A" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="294" cy="676" r="3" fill="#231F1A"/>
<line x1="356" y1="676" x2="358.8" y2="695.8" stroke="#231F1A" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="356" cy="676" r="3" fill="#231F1A"/>
<line x1="418" y1="676" x2="402.9" y2="689.1" stroke="#231F1A" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="418" cy="676" r="3" fill="#231F1A"/>
<line x1="480" y1="676" x2="460.8" y2="670.3" stroke="#231F1A" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="480" cy="676" r="3" fill="#231F1A"/>
<line x1="542" y1="676" x2="536.4" y2="656.8" stroke="#231F1A" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="542" cy="676" r="3" fill="#231F1A"/>
<line x1="604" y1="676" x2="617.1" y2="660.9" stroke="#231F1A" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="604" cy="676" r="3" fill="#231F1A"/>
<line x1="666" y1="676" x2="685.8" y2="678.9" stroke="#231F1A" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="666" cy="676" r="3" fill="#231F1A"/>
<text x="30" y="733" font-size="14" text-anchor="start" fill="#231F1A" >medium pair</text>
<line x1="170" y1="728" x2="170.0" y2="708.0" stroke="#231F1A" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="170" cy="728" r="3" fill="#231F1A"/>
<line x1="232" y1="728" x2="237.2" y2="708.7" stroke="#231F1A" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="232" cy="728" r="3" fill="#231F1A"/>
<line x1="294" y1="728" x2="304.0" y2="710.7" stroke="#231F1A" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="294" cy="728" r="3" fill="#231F1A"/>
<line x1="356" y1="728" x2="370.1" y2="713.9" stroke="#231F1A" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="356" cy="728" r="3" fill="#231F1A"/>
<line x1="418" y1="728" x2="435.3" y2="718.0" stroke="#231F1A" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="418" cy="728" r="3" fill="#231F1A"/>
<line x1="480" y1="728" x2="499.3" y2="722.8" stroke="#231F1A" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="480" cy="728" r="3" fill="#231F1A"/>
<line x1="542" y1="728" x2="562.0" y2="728.0" stroke="#231F1A" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="542" cy="728" r="3" fill="#231F1A"/>
<line x1="604" y1="728" x2="623.3" y2="733.2" stroke="#231F1A" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="604" cy="728" r="3" fill="#231F1A"/>
<line x1="666" y1="728" x2="683.3" y2="738.0" stroke="#231F1A" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="666" cy="728" r="3" fill="#231F1A"/>
<text x="30" y="785" font-size="14" text-anchor="start" fill="#231F1A" >slow pair</text>
<line x1="170" y1="780" x2="170.0" y2="760.0" stroke="#231F1A" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="170" cy="780" r="3" fill="#231F1A"/>
<line x1="232" y1="780" x2="233.0" y2="760.0" stroke="#231F1A" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="232" cy="780" r="3" fill="#231F1A"/>
<line x1="294" y1="780" x2="296.1" y2="760.1" stroke="#231F1A" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="294" cy="780" r="3" fill="#231F1A"/>
<line x1="356" y1="780" x2="359.1" y2="760.2" stroke="#231F1A" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="356" cy="780" r="3" fill="#231F1A"/>
<line x1="418" y1="780" x2="422.2" y2="760.4" stroke="#231F1A" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="418" cy="780" r="3" fill="#231F1A"/>
<line x1="480" y1="780" x2="485.2" y2="760.7" stroke="#231F1A" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="480" cy="780" r="3" fill="#231F1A"/>
<line x1="542" y1="780" x2="548.2" y2="761.0" stroke="#231F1A" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="542" cy="780" r="3" fill="#231F1A"/>
<line x1="604" y1="780" x2="611.2" y2="761.3" stroke="#231F1A" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="604" cy="780" r="3" fill="#231F1A"/>
<line x1="666" y1="780" x2="674.1" y2="761.7" stroke="#231F1A" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="666" cy="780" r="3" fill="#231F1A"/>
<text x="418" y="822" font-size="13" text-anchor="middle" fill="#5E564B" >positions 0 → 8</text>
<text x="30" y="858" font-size="17" text-anchor="start" fill="#231F1A" >4 · In images the pairs split by axis</text>
<text x="30" y="880" font-size="13" text-anchor="start" fill="#5E564B" >Each 128-d head = 64 pairs: 8 follow the frame/segment, 28 the row, 28 the column (axes 16 / 56 / 56).</text>
<text x="30" y="898" font-size="13" text-anchor="start" fill="#5E564B" >Image tokens get a (row, column) on their grid, centred at zero; prompt tokens advance one step per word.</text>
<rect x="60" y="914" width="66" height="36" rx="2" fill="#A7C2A0" stroke="#231F1A" stroke-width="1.2"/>
<text x="93" y="937" font-size="13" text-anchor="middle" fill="#231F1A" >-1, -1</text>
<rect x="132" y="914" width="66" height="36" rx="2" fill="#A7C2A0" stroke="#231F1A" stroke-width="1.2"/>
<text x="165" y="937" font-size="13" text-anchor="middle" fill="#231F1A" >-1, 0</text>
<rect x="204" y="914" width="66" height="36" rx="2" fill="#A7C2A0" stroke="#231F1A" stroke-width="1.2"/>
<text x="237" y="937" font-size="13" text-anchor="middle" fill="#231F1A" >-1, 1</text>
<rect x="276" y="914" width="66" height="36" rx="2" fill="#A7C2A0" stroke="#231F1A" stroke-width="1.2"/>
<text x="309" y="937" font-size="13" text-anchor="middle" fill="#231F1A" >-1, 2</text>
<rect x="60" y="956" width="66" height="36" rx="2" fill="#A7C2A0" stroke="#231F1A" stroke-width="1.2"/>
<text x="93" y="979" font-size="13" text-anchor="middle" fill="#231F1A" >0, -1</text>
<rect x="132" y="956" width="66" height="36" rx="2" fill="#C3D3DB" stroke="#231F1A" stroke-width="1.2"/>
<text x="165" y="979" font-size="13" text-anchor="middle" fill="#231F1A" >0, 0</text>
<rect x="204" y="956" width="66" height="36" rx="2" fill="#E8D5B5" stroke="#231F1A" stroke-width="1.2"/>
<text x="237" y="979" font-size="13" text-anchor="middle" fill="#231F1A" >0, 1</text>
<rect x="276" y="956" width="66" height="36" rx="2" fill="#A7C2A0" stroke="#231F1A" stroke-width="1.2"/>
<text x="309" y="979" font-size="13" text-anchor="middle" fill="#231F1A" >0, 2</text>
<rect x="60" y="998" width="66" height="36" rx="2" fill="#A7C2A0" stroke="#231F1A" stroke-width="1.2"/>
<text x="93" y="1021" font-size="13" text-anchor="middle" fill="#231F1A" >1, -1</text>
<rect x="132" y="998" width="66" height="36" rx="2" fill="#A7C2A0" stroke="#231F1A" stroke-width="1.2"/>
<text x="165" y="1021" font-size="13" text-anchor="middle" fill="#231F1A" >1, 0</text>
<rect x="204" y="998" width="66" height="36" rx="2" fill="#A7C2A0" stroke="#231F1A" stroke-width="1.2"/>
<text x="237" y="1021" font-size="13" text-anchor="middle" fill="#231F1A" >1, 1</text>
<rect x="276" y="998" width="66" height="36" rx="2" fill="#A7C2A0" stroke="#231F1A" stroke-width="1.2"/>
<text x="309" y="1021" font-size="13" text-anchor="middle" fill="#231F1A" >1, 2</text>
<text x="385" y="936" font-size="13" text-anchor="start" fill="#231F1A" >Row pairs rotate with the row,</text>
<text x="385" y="954" font-size="13" text-anchor="start" fill="#231F1A" >column pairs with the column.</text>
<text x="385" y="980" font-size="13" text-anchor="start" fill="#5E564B" >So a head can learn "the patch just to</text>
<text x="385" y="998" font-size="13" text-anchor="start" fill="#5E564B" >my right" (blue → sand: same row,</text>
<text x="385" y="1016" font-size="13" text-anchor="start" fill="#5E564B" >column + 1), e.g. the next letter.</text>
<text x="380.0" y="1072" font-size="13" text-anchor="middle" fill="#5E564B" >RoPE is applied to Q and K only, after RMSNorm; V carries content and is not rotated.</text>
</g></svg>

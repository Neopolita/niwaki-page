<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 720" role="img" aria-labelledby="title desc">
  <title id="title">Before: a full transformer block</title>
  <desc id="desc">A 4096-feature input passes through timestep-modulated normalization, attention and a gated residual addition, then normalization, a feed-forward network and another gated residual addition. Output width remains 4096.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#231F1A"/></marker></defs>
  <rect width="420" height="720" fill="#F7EEE3"/>
  <g stroke="#231F1A" stroke-width="1.3" fill="none" marker-end="url(#arrow)">
    <path d="M210 117 V151 M210 193 V218 M210 261 V280 M210 316 V342 M210 384 V409 M210 452 V482 M210 518 V574"/>
    <path d="M55 96 H32 V298 H191"/><path d="M210 329 H55 V500 H191"/>
  </g>
  <g stroke="#231F1A" stroke-width="1.2">
    <rect x="55" y="75" width="310" height="42" rx="2" fill="#C3D3DB"/>
    <rect x="70" y="151" width="280" height="42" rx="2" fill="#F7EEE3"/>
    <rect x="70" y="218" width="280" height="43" rx="2" fill="#C3D3DB"/>
    <circle cx="210" cy="298" r="18" fill="#F7EEE3"/>
    <rect x="70" y="342" width="280" height="42" rx="2" fill="#F7EEE3"/>
    <rect x="70" y="409" width="280" height="43" rx="2" fill="#C3D3DB"/>
    <circle cx="210" cy="500" r="18" fill="#F7EEE3"/>
    <rect x="55" y="574" width="310" height="48" rx="2" fill="#C3D3DB"/>
  </g>
  <g font-family="Georgia,serif" fill="#231F1A" font-size="18" text-anchor="middle">
    <text x="210" y="38" font-style="italic" font-size="23">Original block 5</text>
    <text x="210" y="102">Input h · 4,096 features per token</text>
    <text x="210" y="178" font-size="16">Normalization + timestep modulation</text>
    <text x="210" y="245">Attention · mix token information</text>
    <text x="210" y="304" font-size="23">+</text>
    <text x="210" y="369" font-size="16">Normalization + timestep modulation</text>
    <text x="210" y="436">Feed-forward network</text>
    <text x="210" y="506" font-size="23">+</text>
    <text x="210" y="596">Teacher hidden-state target</text><text x="210" y="614" font-size="14">4,096 features per token</text>
    <text x="270" y="292" font-size="13" fill="#5E564B">gated update</text>
    <text x="270" y="495" font-size="13" fill="#5E564B">gated update</text>
    <text x="17" y="232" transform="rotate(-90 17 232)" font-size="13" fill="#5E564B">residual input</text>
    <text x="210" y="665" font-size="15" fill="#5E564B">Attention, normalization and feed-forward</text>
    <text x="210" y="687" font-size="15" fill="#5E564B">operations shown schematically.</text>
  </g>
</svg>
